# Собирает фронтенд, прикладывает к сборке application.zip и, если запуск идёт
# по тегу, публикует GitHub-релиз (тело собирает github-release: смёрженный PR —
# по PR, прямой коммит — по коммиту). Переиспользуемый workflow (workflow_call).
# Секрет: GITHUB_TOKEN.
name: Release

on:
  workflow_call:

# pull-requests: read — release-notes ищет смёрженный PR коммита через gh api.
permissions:
  contents: write
  packages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # нужны вся история и теги — для release-notes

      # Падаем на неверном теге до сборки, а не после неё.
      - name: 'Check tag format'
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/tag-format@master
        with:
          version: ${{ github.ref_name }}

      # mode: ref — версия из тега, инициировавшего запуск (идёт и в VITE_VERSION).
      - name: 'Version'
        id: version
        uses: moogur/all-workflows/.github/actions/app-version@master
        with:
          mode: ref

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      # Сборка фронтенда с пробросом версии и упаковка dist в application.zip.
      - name: 'Create assets'
        run: |
          export VITE_VERSION=${{ steps.version.outputs.version }} && npm run build
          mkdir application
          mv dist application/dist
          zip -r application.zip application

      - name: 'Publish release'
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/github-release@master
        with:
          tag: ${{ github.ref_name }}
          assets: ./application.zip
          token: ${{ secrets.GITHUB_TOKEN }}
