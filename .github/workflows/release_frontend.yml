# Публикует релиз, собирает фронтенд и прикладывает к релизу application.zip.
# Источник тела релиза выбирается параметром notes_source: 'drafter' — Release Drafter
# по смёрженным PR; 'commits' — коммиты между текущим и предыдущим тегом (разработка
# в одной ветке). Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Release

on:
  workflow_call:
    inputs:
      notes_source:
        description: "Release notes source: 'drafter' (PRs) or 'commits' (commits between tags)"
        type: string
        required: false
        default: 'drafter'

permissions:
  contents: write
  packages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          # Режиму commits нужны вся история и теги, чтобы посчитать диапазон.
          # Строки, а не числа: 0 в выражении GitHub ложно и схлопнет условие в 1.
          fetch-depth: ${{ inputs.notes_source == 'commits' && '0' || '1' }}

      # mode: ref — версия из тега, инициировавшего запуск (идёт и в VITE_VERSION).
      - name: 'Version'
        id: version
        uses: moogur/all-workflows/.github/actions/app-version@master
        with:
          mode: ref

      - name: 'Publish release (drafter)'
        id: create_release
        if: inputs.notes_source == 'drafter'
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.version.outputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Release notes'
        id: notes
        if: inputs.notes_source == 'commits'
        uses: moogur/all-workflows/.github/actions/release-notes@master

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      # Сборка фронтенда с пробросом версии и упаковка dist в application.zip.
      - name: 'Create assets'
        run: |
          export VITE_VERSION=${{ steps.version.outputs.version }} && npm run build
          mkdir application
          mv dist application/dist
          zip -r application.zip application

      # В режиме drafter релиз уже создан — шаг только приложит ассет; в режиме
      # commits создаст релиз с телом из коммитов. Тег берём у того, кто релиз завёл.
      - name: 'Publish release'
        uses: moogur/all-workflows/.github/actions/publish-release@master
        with:
          tag: ${{ inputs.notes_source == 'drafter' && steps.create_release.outputs.tag_name || github.ref_name }}
          notes_file: ${{ steps.notes.outputs.notes_file }}
          assets: ./application.zip
          token: ${{ secrets.GITHUB_TOKEN }}
