# Публикует релиз (Release Drafter), собирает фронтенд и прикладывает к релизу
# application.zip. Переиспользуемый workflow (workflow_call); запускается на push тега.
# Секрет: GITHUB_TOKEN.
name: Release

on:
  workflow_call:

permissions:
  contents: write
  packages: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      # mode: ref — версия из тега, инициировавшего запуск (идёт и в VITE_VERSION).
      - name: 'Version'
        id: version
        uses: moogur/all-workflows/.github/actions/app-version@master
        with:
          mode: ref

      - name: 'Publish release'
        uses: release-drafter/release-drafter@v6
        id: create_release
        with:
          version: ${{ steps.version.outputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      # Сборка фронтенда с пробросом версии и упаковка dist в application.zip.
      - name: 'Create assets'
        run: |
          export VITE_VERSION=${{ steps.version.outputs.version }} && npm run build
          mkdir application
          mv dist application/dist
          zip -r application.zip application

      # ПРИМЕЧАНИЕ: upload-release-asset заархивирован; см. docs/modernization.md.
      - name: Upload Release Asset
        uses: actions/upload-release-asset@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./application.zip
          asset_name: application.zip
          asset_content_type: application/zip
