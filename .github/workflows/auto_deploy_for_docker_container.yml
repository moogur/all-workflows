# Автодеплой: проверяет, появилась ли новая версия во внешнем репозитории,
# и только тогда запускает deploy_for_docker_container.
# «Последняя увиденная» версия хранится в переменной окружения LAST_UPDATE_VALUE
# нужного GitHub Environment и записывается ТОЛЬКО после успешного деплоя:
# иначе упавшая сборка считалась бы доставленной и уже не повторилась бы.
# Переиспользуемый workflow (workflow_call).
# Секреты: UPDATE_VARIABLES_CLI_TOKEN (PAT для записи переменной), GITHUB_TOKEN.
name: Auto deploy for docker container

on:
  workflow_call:
    inputs:
      repository_url:
        description: "Url for git repository"  # отслеживаемый внешний репозиторий
        type: string
        required: true
      environment:
        description: "Environment"  # GitHub Environment, где лежит LAST_UPDATE_VALUE
        type: string
        required: true
      type:
        description: "The type of definition of the latest version"
        type: string
        required: false
        default: "commit" # commit | tag
      repository_branch: # need for commit type
        description: "Branch to check for updates"
        type: string
        required: false
        default: "master"

# Не уже прав вложенного deploy_for_docker_container: вызванный workflow
# не может просить больше, чем есть у вызвавшего.
permissions:
  contents: read
  packages: write

jobs:
  checking_to_use_the_latest_version:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}  # нужен для чтения vars.LAST_UPDATE_VALUE
    outputs:
      last_update_value: ${{ steps.check.outputs.value }}

    steps:
      # Свой репозиторий здесь не нужен: сравнение идёт по внешнему.
      # Маркер свежести: для type=commit — время последнего коммита ветки,
      # для type=tag — самый свежий по дате создания тег внешнего репозитория.
      - name: 'Check'
        id: check
        uses: moogur/all-workflows/.github/actions/remote-update-check@master
        with:
          repository_url: ${{ inputs.repository_url }}
          type: ${{ inputs.type }}
          repository_branch: ${{ inputs.repository_branch }}

      # Нет обновлений → намеренный `exit 1`: job падает, и зависящие от него
      # jobs не запускаются (так пропускаются ВСЕ последующие шаги).
      # Подробнее о выборе — docs/modernization.md.
      - name: 'Cancel job'
        if: steps.check.outputs.value == vars.LAST_UPDATE_VALUE
        run: exit 1

  # Запускается только если предыдущий job прошёл (т.е. версия изменилась).
  auto_deploy:
    needs: checking_to_use_the_latest_version
    uses: ./.github/workflows/deploy_for_docker_container.yml
    secrets: inherit

  # Версию запоминаем только после успешного деплоя.
  save_update_value:
    needs: [checking_to_use_the_latest_version, auto_deploy]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}  # на случай, если PAT — секрет окружения

    steps:
      - name: 'Save update value'
        uses: moogur/all-workflows/.github/actions/save-update-value@master
        with:
          environment: ${{ inputs.environment }}
          name: LAST_UPDATE_VALUE
          value: ${{ needs.checking_to_use_the_latest_version.outputs.last_update_value }}
          token: ${{ secrets.UPDATE_VARIABLES_CLI_TOKEN }}
