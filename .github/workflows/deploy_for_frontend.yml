# Собирает фронтенд и публикует содержимое dist в отдельную ветку `builds`
# (force-push) — удобно для статического хостинга, раздающего эту ветку.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy frontend to builds branch

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      - name: 'Build'
        run: npm run build

      - name: 'Set up Git'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      # Пересобираем ветку builds: содержимое dist становится корнем ветки.
      - name: 'Create a build branch'
        run: |
          git checkout -b builds
          git rm -rf .
          cp -r dist/* .
          rm -fr node_modules
          rm -fr dist
          git add .
          git commit -m "Deploy build"

      - name: 'Push to build branch'
        run: |
          git push origin builds --force
