# Перемещает задачи Kanboard по колонкам в зависимости от события Git
# (push/pr/merge/deploy). Логика работы с API — в scripts/kanboard_requests.sh,
# извлечение task_id/версии из git — в scripts/kanboard_task_id.sh (сама форма
# номера задачи и тегов — в lib/commit.sh, lib/tags.sh, lib/version.sh).
# Переиспользуемый workflow (workflow_call). Секреты: KANBOARD_HOST/USER/TOKEN.
# Секреты и вычисленные значения доходят до kanboard_requests.sh только через env:
# ни в тело скрипта, ни в исполняемый файл ничего не подставляется (docs/security.md, п. 8).
name: Kanboard for single branch

on:
  workflow_call:
    inputs:
      kanboard_columns:
        description: "List of column ids, in order, from left to right, separated by commas"
        type: string
        required: true
      project_type:
        description: "Type of project used"  # single_branch | multi_branch
        type: string # single_branch, multi_branch
        required: true
      event_type:
        description: "Event type"  # push | pr | merge | deploy
        type: string # push, pr, merge, deploy
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kanboard:
    runs-on: ubuntu-latest

    steps:
      # Репозиторий-потребитель (его задачи двигаем; нужна история для шага deploy).
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Этот репозиторий (all-workflows), запиненный к версии вызванного workflow,
      # чтобы взять kanboard_requests.sh без wget с master. Кладём в подпапку.
      - name: 'Checkout all-workflows'
        uses: actions/checkout@v7
        with:
          repository: moogur/all-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .all-workflows

      # Скрипт берём прямо из чекаута all-workflows (копировать и подставлять в него
      # значения нельзя — см. docs/security.md, п. 8); значения читает он сам из env.
      - name: 'Set variables'
        if: "inputs.event_type != 'deploy'"
        id: variables
        env:
          # Имя ветки задаёт автор PR, а заголовок коммита — любой его автор, поэтому
          # всё недоверенное приходит переменной окружения, а не интерполяцией в скрипт.
          HEAD_REF: ${{ github.head_ref }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          EVENT_TYPE: ${{ inputs.event_type }}
          KANBOARD_URL: ${{ secrets.KANBOARD_HOST }}
          KANBOARD_USER: ${{ secrets.KANBOARD_USER }}
          KANBOARD_TOKEN: ${{ secrets.KANBOARD_TOKEN }}
        run: |
          source .all-workflows/scripts/kanboard_task_id.sh

          if [[ "$PROJECT_TYPE" == "single_branch" ]]; then
            task_id=$(kanboard_task_id_from_last_commit)
          elif [[ "$EVENT_TYPE" == "pr" ]] || [[ "$EVENT_TYPE" == "merge" ]]; then
            task_id=$(kanboard_task_id_from_ref "$HEAD_REF")
          else
            task_id=$(kanboard_task_id_from_ref "$GITHUB_REF_NAME")
          fi

          # Kanboard не должен блокировать пайплайн: без валидного номера просто пропускаем.
          # Само значение не печатаем — оно недоверенное (workflow-команды в логе).
          if [[ -z "$task_id" ]]; then
            echo "Kanboard: в имени ветки/заголовке коммита нет числового номера задачи, шаги пропущены"
            exit 0
          fi

          export KANBOARD_TASK_ID=$task_id
          source .all-workflows/scripts/kanboard_requests.sh

          task_info=$(request_for_get_info_task) || task_info=''

          # Ответ API тоже недоверенный: в вывод и дальше идут только числа.
          current_column_id=$(jq -r '.result.column_id // empty' <<< "$task_info" 2>/dev/null)
          project_id=$(jq -r '.result.project_id // empty' <<< "$task_info" 2>/dev/null)
          swimlane_id=$(jq -r '.result.swimlane_id // empty' <<< "$task_info" 2>/dev/null)

          for value in "$current_column_id" "$project_id" "$swimlane_id"; do
            if ! commit_task_id_valid "$value"; then
              echo "Kanboard: не удалось получить данные задачи $task_id, шаги пропущены"
              exit 0
            fi
          done

          {
            echo "task_id=${task_id}"
            echo "current_column_id=${current_column_id}"
            echo "project_id=${project_id}"
            echo "swimlane_id=${swimlane_id}"
          } >> "$GITHUB_OUTPUT"

          echo "task_id $task_id"
          echo "current_column_id $current_column_id"

      - name: "Transferring the task to the in progress status"
        if: "inputs.event_type == 'push' && steps.variables.outputs.task_id != ''"
        env:
          KANBOARD_COLUMNS: ${{ inputs.kanboard_columns }}
          PROJECT_TYPE: ${{ inputs.project_type }}
          CURRENT_COLUMN_ID: ${{ steps.variables.outputs.current_column_id }}
          KANBOARD_URL: ${{ secrets.KANBOARD_HOST }}
          KANBOARD_USER: ${{ secrets.KANBOARD_USER }}
          KANBOARD_TOKEN: ${{ secrets.KANBOARD_TOKEN }}
          KANBOARD_TASK_ID: ${{ steps.variables.outputs.task_id }}
          KANBOARD_PROJECT_ID: ${{ steps.variables.outputs.project_id }}
          KANBOARD_SWIMLANE_ID: ${{ steps.variables.outputs.swimlane_id }}
        run: |
          . .all-workflows/scripts/kanboard_requests.sh

          IFS=',' read -r -a all_columns <<< "$KANBOARD_COLUMNS"
          in_progress_column_id=${all_columns[3]}
          unset 'all_columns[3]'
          if [[ "$PROJECT_TYPE" == "multi_branch" ]]; then
            unset 'all_columns[4]'
          fi

          export IFS=""
          if [[ ${all_columns[*]} =~ $CURRENT_COLUMN_ID ]]; then
            response=`echo $(request_for_move_task $in_progress_column_id)`
            save_message_in_file IN_PROGRESS -1 "$response" $(jq '.result' <<< "$response")
          else
            save_message_in_file IN_PROGRESS -1 "The task is already in the right column" false
          fi

      - name: "Transferring the task to the in review status"
        if: "inputs.event_type == 'pr' && inputs.project_type == 'multi_branch' && steps.variables.outputs.task_id != ''"
        env:
          KANBOARD_COLUMNS: ${{ inputs.kanboard_columns }}
          CURRENT_COLUMN_ID: ${{ steps.variables.outputs.current_column_id }}
          KANBOARD_URL: ${{ secrets.KANBOARD_HOST }}
          KANBOARD_USER: ${{ secrets.KANBOARD_USER }}
          KANBOARD_TOKEN: ${{ secrets.KANBOARD_TOKEN }}
          KANBOARD_TASK_ID: ${{ steps.variables.outputs.task_id }}
          KANBOARD_PROJECT_ID: ${{ steps.variables.outputs.project_id }}
          KANBOARD_SWIMLANE_ID: ${{ steps.variables.outputs.swimlane_id }}
        run: |
          . .all-workflows/scripts/kanboard_requests.sh

          IFS=',' read -r -a all_columns <<< "$KANBOARD_COLUMNS"

          export IFS=""
          if [[ ${all_columns[3]} == "$CURRENT_COLUMN_ID" ]]; then
            response=`echo $(request_for_move_task ${all_columns[4]})`
            save_message_in_file REVIEW -1 "$response" $(jq '.result' <<< "$response")
          else
            save_message_in_file REVIEW -1 "The task is already in the right column" false
          fi

      - name: "Transferring the task to the in merged status"
        if: "inputs.event_type == 'merge' && inputs.project_type == 'multi_branch' && steps.variables.outputs.task_id != ''"
        env:
          KANBOARD_COLUMNS: ${{ inputs.kanboard_columns }}
          CURRENT_COLUMN_ID: ${{ steps.variables.outputs.current_column_id }}
          KANBOARD_URL: ${{ secrets.KANBOARD_HOST }}
          KANBOARD_USER: ${{ secrets.KANBOARD_USER }}
          KANBOARD_TOKEN: ${{ secrets.KANBOARD_TOKEN }}
          KANBOARD_TASK_ID: ${{ steps.variables.outputs.task_id }}
          KANBOARD_PROJECT_ID: ${{ steps.variables.outputs.project_id }}
          KANBOARD_SWIMLANE_ID: ${{ steps.variables.outputs.swimlane_id }}
        run: |
          . .all-workflows/scripts/kanboard_requests.sh

          IFS=',' read -r -a all_columns <<< "$KANBOARD_COLUMNS"

          export IFS=""
          if [[ ${all_columns[4]} == "$CURRENT_COLUMN_ID" ]]; then
            response=`echo $(request_for_move_task ${all_columns[5]})`
            save_message_in_file MERGED -1 "$response" $(jq '.result' <<< "$response")
          else
            save_message_in_file MERGED -1 "The task is already in the right column" false
          fi

      - name: "Transferring the tasks to the in deploy status"
        if: "inputs.event_type == 'deploy' && inputs.project_type == 'multi_branch'"
        env:
          KANBOARD_COLUMNS: ${{ inputs.kanboard_columns }}
          KANBOARD_URL: ${{ secrets.KANBOARD_HOST }}
          KANBOARD_USER: ${{ secrets.KANBOARD_USER }}
          KANBOARD_TOKEN: ${{ secrets.KANBOARD_TOKEN }}
        run: |
          . .all-workflows/scripts/kanboard_requests.sh
          source .all-workflows/scripts/kanboard_task_id.sh

          mapfile -t array_tags < <(kanboard_deploy_tags)
          app_version=$(kanboard_release_version "${array_tags[0]}")

          previous_tag=''
          [[ "${#array_tags[@]}" -eq 2 ]] && previous_tag="${array_tags[1]}"

          # kanboard_deploy_task_ids уже отдаёт уникальные id (без дублей).
          declare -A uniq_array_tasks_ids
          while IFS= read -r task_id; do
            uniq_array_tasks_ids[$task_id]=0
          done < <(kanboard_deploy_task_ids "${array_tags[0]}" "$previous_tag")

          IFS=',' read -r -a all_columns <<< "$KANBOARD_COLUMNS"

          for task_id in "${!uniq_array_tasks_ids[@]}"; do
            task_info=`echo $(request_for_get_info_task $task_id)`
            current_column_id=`echo $(jq '.result.column_id' <<< $task_info)`

            if [[ -z $current_column_id ]]; then
              export IFS=""
              save_message_in_file_for_deploy_get_task_info_error $task_id "$task_info"
              continue
            fi

            if [[ ${all_columns[5]} == $current_column_id ]]; then
              export IFS=""
              project_id=`echo $(jq '.result.project_id' <<< $task_info)`
              swimlane_id=`echo $(jq '.result.swimlane_id' <<< $task_info)`
              move_response=`echo $(request_for_move_task ${all_columns[6]} $task_id 1 $project_id $swimlane_id)`
              save_message_in_file DEPLOY $task_id "$move_response" $(jq '.result' <<< "$move_response")
            else
              export IFS=""
              save_message_in_file DEPLOY $task_id "The task is already in the right column" false
            fi

            task_metadata=`echo $(request_for_get_metadata_task $task_id)`
            temporary_app_version=`echo $(jq '.result' <<< $task_metadata)`
            task_app_version=${temporary_app_version:1:-1}

            if [[ -z $task_app_version ]]; then
              task_app_version=$app_version
            elif [[ "$task_app_version" =~ $app_version ]]; then
              continue
            else
              task_app_version+=", $app_version"
            fi

            app_response=`echo $(request_for_update_task_app_version $task_id $task_app_version)`
            save_message_in_file_for_add_app_version $task_id "$app_response" $(jq '.result' <<< "$app_response")
          done

      - name: "Show result"
        run: |
          echo -e $(cat ./message.tmpl)
