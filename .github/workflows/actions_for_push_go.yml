# CI для Go-проекта: сборка → vet → статанализ → тесты.
# Переиспользуемый workflow (вызывается через `uses: ...@<ref>`).
name: Test, lint, and build (Go)

on:
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip pipeline tests"  # 'true' — пропустить шаг тестов
        type: string
        required: false
        default: 'false'
      folder:
        description: "Working folder"  # подпапка монорепозитория; '.' — корень
        type: string
        required: false
        default: '.'
      test_setup_script:
        description: "Подготовка к тестам: путь к скрипту относительно корня репозитория"  # выполняется перед шагом тестов
        type: string
        required: false
        default: ''
      test_setup_cache:
        description: "Подготовка к тестам: путь (или пути по одному на строку), кэшируемый между запусками"  # только вместе с test_setup_script
        type: string
        required: false
        default: ''

# Новый запуск для той же ветки/папки отменяет предыдущий незавершённый.
permissions:
  contents: read

concurrency:
  group: actions_for_push_go-${{ github.workflow }}-${{ github.ref }}-${{ inputs.folder }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Для монорепозитория: переносим содержимое подпапки в корень рабочей директории.
      - name: 'Prepare working folder'
        if: "inputs.folder != '.'"
        env:
          FOLDER: ${{ inputs.folder }}
        run: cp -r "$FOLDER"/. .

      # Версия Go берётся из директивы `go` в go.mod.
      - name: 'Detect Go version'
        id: go
        uses: moogur/all-workflows/.github/actions/detect-go-version@master

      - name: 'Setup go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Verify dependencies
        run: go mod verify  # проверка контрольных сумм зависимостей

      - name: Build
        run: go build -v ./...

      - name: Run go vet
        run: go vet ./...

      # Статанализ honnef.co/staticcheck (ставится на лету).
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # ВНИМАНИЕ: golint заархивирован; см. docs/modernization.md (замена — golangci-lint).
      - name: Run golint
        run: |
          go install golang.org/x/lint/golint@latest
          golint ./...

      # Подготовка к тестам скриптом потребителя; путь считается от рабочей папки (folder уже в корне).
      # В test_setup_cache не кладите секреты: кэш Actions читает любой, у кого есть read-доступ к репозиторию.
      - name: 'Restore setup cache'
        if: "inputs.skip_tests != 'true' && inputs.test_setup_script != '' && inputs.test_setup_cache != ''"
        uses: actions/cache@v5
        with:
          path: ${{ inputs.test_setup_cache }}
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.test_setup_script) }}

      - name: 'Run setup script'
        if: "inputs.skip_tests != 'true' && inputs.test_setup_script != ''"
        uses: moogur/all-workflows/.github/actions/run-build-script@master
        with:
          file_path: ${{ inputs.test_setup_script }}

      # -race: детектор гонок. -json нужен для сводки: лог остаётся читаемым за счёт jq,
      # отчёт целиком уходит в файл. shell: bash включает pipefail — упавшие тесты роняют шаг,
      # а не маскируются успешным jq в конце конвейера.
      - name: Run tests
        id: tests
        if: "inputs.skip_tests != 'true'"
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/go-test-report.json
        run: |
          go test -race -vet=off -json ./... \
            | tee "$REPORT" \
            | jq --unbuffered -Rj 'fromjson? | objects | select(.Action == "output" or .Action == "build-output") | .Output'

      # Сводка нужна и при упавших тестах; шаг пропущен — тесты не запускались (skip_tests или упал прошлый шаг).
      - name: 'Test summary'
        if: "!cancelled() && steps.tests.outcome != 'skipped'"
        uses: moogur/all-workflows/.github/actions/test-summary@master
        with:
          format: go
          report: ${{ runner.temp }}/go-test-report.json
