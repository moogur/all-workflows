# CI для Node.js-проекта: установка → линт → сборка → тесты.
# Переиспользуемый workflow (вызывается через `uses: ...@<ref>`).
name: Test, lint, and build (Node.js)

on:
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip pipeline tests"  # 'true' — пропустить шаг тестов
        type: string
        required: false
        default: 'false'
      folder:
        description: "Working folder"  # подпапка монорепозитория; '.' — корень
        type: string
        required: false
        default: '.'
      test_setup_script:
        description: "Подготовка к тестам: путь к скрипту относительно корня репозитория"  # выполняется перед шагом тестов
        type: string
        required: false
        default: ''
      test_setup_cache:
        description: "Подготовка к тестам: путь (или пути по одному на строку), кэшируемый между запусками"  # только вместе с test_setup_script
        type: string
        required: false
        default: ''

# Новый запуск для той же ветки/папки отменяет предыдущий незавершённый.
permissions:
  contents: read
  packages: read

concurrency:
  group: actions_for_push-${{ github.workflow }}-${{ github.ref }}-${{ inputs.folder }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # полная история (нужна, например, для версий по тегам)

      # Для монорепозитория: переносим содержимое подпапки в корень рабочей директории.
      - name: 'Prepare working folder'
        if: "inputs.folder != '.'"
        env:
          FOLDER: ${{ inputs.folder }}
        run: cp -r "$FOLDER"/. .

      # Определение версии Node из package.json + setup-node.
      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      # .npmrc для приватного scope @moogur в GitHub Packages.
      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        uses: moogur/all-workflows/.github/actions/npm-install@master

      - name: 'Lint'
        run: npm run lint

      - name: 'Build'
        run: npm run build

      # Раннер (jest или vitest) и аргументы, с которыми он дополнительно пишет JSON-отчёт для сводки.
      # Стоит до подготовки к тестам: та должна идти вплотную перед тестовым шагом.
      - name: 'Detect test runner'
        id: runner
        if: "inputs.skip_tests != 'true'"
        uses: moogur/all-workflows/.github/actions/node-test-runner@master

      # Подготовка к тестам скриптом потребителя; путь считается от рабочей папки (folder уже в корне).
      # В test_setup_cache не кладите секреты: кэш Actions читает любой, у кого есть read-доступ к репозиторию.
      - name: 'Restore setup cache'
        if: "inputs.skip_tests != 'true' && inputs.test_setup_script != '' && inputs.test_setup_cache != ''"
        uses: actions/cache@v5
        with:
          path: ${{ inputs.test_setup_cache }}
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.test_setup_script) }}

      - name: 'Run setup script'
        if: "inputs.skip_tests != 'true' && inputs.test_setup_script != ''"
        uses: moogur/all-workflows/.github/actions/run-build-script@master
        with:
          file_path: ${{ inputs.test_setup_script }}

      # Аргументы в TEST_ARGS без кавычек намеренно: это несколько слов, а пути из RUNNER_TEMP без пробелов.
      - name: 'Test'
        id: tests
        if: "inputs.skip_tests != 'true'"
        env:
          TEST_ARGS: ${{ steps.runner.outputs.args }}
        run: npm run test:coverage -- $TEST_ARGS

      # Сводка нужна и при упавших тестах; шаг пропущен — тесты не запускались (skip_tests или упал прошлый шаг).
      - name: 'Test summary'
        if: "!cancelled() && steps.tests.outcome != 'skipped' && steps.runner.outputs.format != ''"
        uses: moogur/all-workflows/.github/actions/test-summary@master
        with:
          format: ${{ steps.runner.outputs.format }}
          report: ${{ steps.runner.outputs.report }}
