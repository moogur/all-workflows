# CI для Node.js-проекта: установка → линт → сборка → тесты.
# Переиспользуемый workflow (вызывается через `uses: ...@<ref>`).
name: Test, lint, and build (Node.js)

on:
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip pipeline tests"  # 'true' — пропустить шаг тестов
        type: string
        required: false
        default: 'false'
      folder:
        description: "Working folder"  # подпапка монорепозитория; '.' — корень
        type: string
        required: false
        default: '.'

# Новый запуск для той же ветки/папки отменяет предыдущий незавершённый.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.folder }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # полная история (нужна, например, для версий по тегам)

      # Для монорепозитория: переносим содержимое подпапки в корень рабочей директории.
      - name: 'Prepare working folder'
        if: "inputs.folder != '.'"
        run: cp -r ${{ inputs.folder }}/. .

      # Определение версии Node из package.json + setup-node с кэшем npm (~/.npm).
      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      # .npmrc для приватного scope @moogur в GitHub Packages.
      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci  # чистая установка строго по package-lock.json

      - name: 'Lint'
        run: npm run lint

      - name: 'Build'
        run: npm run build

      - name: 'Test'
        if: "inputs.skip_tests != 'true'"
        run: npm run test:coverage
