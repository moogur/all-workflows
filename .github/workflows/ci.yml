name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (статика workflow'ов)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Релиз берётся напрямую и сверяется по sha256: сторонний загрузчик с ветки
      # main исполнялся бы без всякой проверки (supply-chain). Хеш — linux_amd64,
      # при смене версии обновить оба значения по <release>/..._checksums.txt.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
      - name: Run actionlint
        env:
          # inline-скрипты в существующих workflow'ах содержат намеренный
          # word-splitting (SC2086 и т.п.) — проверяем shellcheck'ом только ошибки.
          SHELLCHECK_OPTS: --severity=error
        # -ignore: github.job_workflow_sha — валидное поле контекста (GitHub docs),
        #   но отсутствует в схеме actionlint 1.7.12; используется в kanboard.yml.
        run: ./actionlint -color -ignore 'job_workflow_sha'

  shellcheck:
    name: shellcheck (bash-скрипты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint scripts
        run: shellcheck .github/actions/*/*.sh scripts/*.sh .husky/commit-msg tests/helpers.bash

  yamllint:
    name: yamllint (структура YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .github

  bats:
    name: bats (unit-тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats and jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run tests
        run: bats tests/
