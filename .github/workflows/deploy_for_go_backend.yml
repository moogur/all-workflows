# Сборка и публикация Docker-образа Go-бэкенда (multi-stage на scratch) в GitHub Packages.
# Тело сборки — в общем action docker-image; здесь только специфика Go.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for golang docker

on:
  workflow_call:
    inputs:
      github_user:
        description: "The Github user who started workflow"  # владелец образа / логин в реестр
        type: string
        required: false
        default: $GITHUB_ACTOR
      format_mode:
        description: "Tag format: 'date' (legacy — version as is + latest) or 'semver' (vX.Y.Z, vX.Y, vX, latest)"
        type: string
        required: false
        default: 'date'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Версия Go для build-arg сборки образа.
      - name: 'Detect Go version'
        id: go
        uses: moogur/all-workflows/.github/actions/detect-go-version@master

      - name: 'Build and publish image'
        uses: moogur/all-workflows/.github/actions/docker-image@master
        with:
          github_user: ${{ inputs.github_user }}
          format_mode: ${{ inputs.format_mode }}
          dockerfile: deploy_go_backend.dockerfile
          dockerignore: .full.dockerignore
          build_args: ARG_GO_VERSION=${{ steps.go.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
