# Сборка единого Docker-образа приложения «бэкенд (Go) + фронтенд (Node.js)»
# и публикация в GitHub Packages. Ожидает структуру проекта backend/ и frontend/.
# Тело сборки — в общем action docker-image.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy full application

on:
  workflow_call:
    inputs:
      github_user:
        description: "The Github user who started workflow"  # владелец образа / логин в реестр
        type: string
        required: false
        default: $GITHUB_ACTOR
      format_mode:
        description: "Tag format: 'date' (legacy — version as is + latest) or 'semver' (vX.Y.Z, vX.Y, vX, latest)"
        type: string
        required: false
        default: 'date'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Detect Node.js version'
        id: node
        uses: moogur/all-workflows/.github/actions/detect-node-version@master

      - name: 'Detect Go version'
        id: go
        uses: moogur/all-workflows/.github/actions/detect-go-version@master

      # .npmrc создаётся в frontend/ — именно там выполняется npm-сборка внутри образа.
      - name: 'Setup npm'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: frontend

      - name: 'Build and publish image'
        uses: moogur/all-workflows/.github/actions/docker-image@master
        with:
          github_user: ${{ inputs.github_user }}
          format_mode: ${{ inputs.format_mode }}
          dockerfile: full_deploy.dockerfile
          dockerignore: .full.dockerignore
          build_args: |
            ARG_NODE_VERSION=${{ steps.node.outputs.version }}
            ARG_GO_VERSION=${{ steps.go.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
