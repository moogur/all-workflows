# Перемещает задачи Kaneo по статусам (колонкам) и заполняет их поля по схеме
# (scripts/kaneo/schemes.json) в зависимости от события Git (push/pr/merge/deploy).
# Вся логика — в scripts/kaneo/engine.sh (запросы к API — requests.sh, отчёт — messages.sh,
# откуда брать номер задачи — task_key.sh; сама форма номера и тегов — lib/commit.sh,
# lib/tags.sh). Переиспользуемый workflow (workflow_call). Секреты: KANEO_HOST (базовый URL,
# API на <host>/api/...), KANEO_TOKEN (API-ключ).
# Секреты и входы доходят до скриптов только через env:
# ни в тело скрипта, ни в исполняемый файл ничего не подставляется (docs/security.md, п. 8).
name: Kaneo

on:
  workflow_call:
    inputs:
      kaneo_scheme:
        description: "Name of the scheme from scripts/kaneo/schemes.json"  # single | single_ready | single_hold | push_only | multi
        type: string
        required: true
      event_type:
        description: "Event type"  # push | pr | merge | deploy
        type: string # push, pr, merge, deploy
        required: true

permissions:
  contents: read

concurrency:
  group: kaneo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kaneo:
    runs-on: ubuntu-latest

    steps:
      # Репозиторий-потребитель (его задачи двигаем; нужна история для шага deploy).
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Этот репозиторий (all-workflows), запиненный к версии вызванного workflow,
      # чтобы взять скрипты kaneo без wget с master. Кладём в подпапку.
      - name: 'Checkout all-workflows'
        uses: actions/checkout@v7
        with:
          repository: moogur/all-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .all-workflows

      # Скрипты берём прямо из чекаута all-workflows (копировать и подставлять в них
      # значения нельзя — см. docs/security.md, п. 8); значения читают они сами из env.
      - name: "Move tasks and fill fields"
        env:
          # Имя ветки задаёт автор PR, а заголовок коммита — любой его автор, поэтому
          # всё недоверенное приходит переменной окружения, а не интерполяцией в скрипт.
          HEAD_REF: ${{ github.head_ref }}
          KANEO_SCHEME: ${{ inputs.kaneo_scheme }}
          EVENT_TYPE: ${{ inputs.event_type }}
          KANEO_URL: ${{ secrets.KANEO_HOST }}
          KANEO_TOKEN: ${{ secrets.KANEO_TOKEN }}
        run: |
          source .all-workflows/scripts/kaneo/engine.sh
          kaneo_run

      - name: "Show result"
        run: |
          if [[ -f ./message.tmpl ]]; then
            cat ./message.tmpl
          fi
