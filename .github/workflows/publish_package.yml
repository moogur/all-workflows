# Сборка и публикация npm-пакета в GitHub Packages.
# Требует зависимость @moogur/helpers (скрипт pre-build.js).
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Publish package

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      - name: 'Build'
        run: npm run build

      # pre-build.js (@moogur/helpers) готовит package.json к публикации, затем npm publish.
      - name: "Publish packages"
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"

          node ./node_modules/@moogur/helpers/pre-build.js
          npm publish
