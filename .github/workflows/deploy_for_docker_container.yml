# Универсальная сборка и публикация Docker-образа по локальному Dockerfile проекта
# (в отличие от deploy_for_backend/go — здесь Dockerfile не скачивается).
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for docker container

on:
  workflow_call:
    inputs:
      github_user:
        description: "The Github user who started workflow"  # владелец образа / логин в реестр
        type: string
        required: false
        default: $GITHUB_ACTOR
      format_mode:
        description: "Tag format: 'date' (legacy — version as is + latest) or 'semver' (vX.Y.Z, vX.Y, vX, latest)"
        type: string
        required: false
        default: 'date'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Global env"
        id: global_env
        run: |
          echo "IMAGE_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "DOCKERHUB_IMAGE_NAME=docker.pkg.github.com/${{ inputs.github_user }}/${{ github.event.repository.name }}/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      # Версия сборки — тег, инициировавший запуск: берём именно его, а не
      # `git describe`, чтобы не поймать другой тег того же коммита.
      # Сборка без тега (расписание, ручной запуск) всегда идёт как
      # dd.mm.yyyy-HHMM-auto в формате date, даже в semver-репозитории: иначе
      # плановая пересборка переписала бы релизные vX.Y.Z другим содержимым.
      # Время в метке — чтобы две сборки за сутки не затёрли друг друга, UTC.
      - name: "Determining the version"
        id: version
        run: |
          if [[ ${{ github.ref_type }} == 'tag' ]]; then
            version=${{ github.ref_name }}
            mode=${{ inputs.format_mode }}
          else
            version=$(date -u +"%d.%m.%Y-%H%M-auto")
            mode=date
          fi
          echo "VERSION=${version}" >> $GITHUB_OUTPUT
          echo "FORMAT_MODE=${mode}" >> $GITHUB_OUTPUT

      # Полный список тегов образа по выбранному формату.
      - name: "Docker tags"
        id: tags
        uses: moogur/all-workflows/.github/actions/docker-tags@master
        with:
          image: ${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}
          version: ${{ steps.version.outputs.VERSION }}
          format_mode: ${{ steps.version.outputs.FORMAT_MODE }}

      - name: "Build and tag image"
        run: |
          build_args=()
          for ref in ${{ steps.tags.outputs.tags }}; do build_args+=(-t "$ref"); done
          docker build "${build_args[@]}" .

      - name: "docker login"
        run: docker login docker.pkg.github.com -u ${{ inputs.github_user }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish image"
        run: |
          for ref in ${{ steps.tags.outputs.tags }}; do docker push "$ref"; done
