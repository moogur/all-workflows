# Сборка и публикация Docker-образа по локальному Dockerfile проекта
# (в отличие от deploy_for_backend/go — здесь Dockerfile не подменяется).
# Тело сборки — в общем action docker-image.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for docker container

on:
  workflow_call:
    inputs:
      github_user:
        description: "Владелец образа и логин в реестр; пусто — владелец репозитория"
        type: string
        required: false
        default: ''

# contents: write — по тегу docker-image создаёт GitHub-релиз (docker-release).
permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Build and publish image'
        uses: moogur/all-workflows/.github/actions/docker-image@master
        with:
          github_user: ${{ inputs.github_user }}
          token: ${{ secrets.GITHUB_TOKEN }}
