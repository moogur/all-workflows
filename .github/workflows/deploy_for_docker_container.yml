# Сборка и публикация Docker-образа по локальному Dockerfile проекта
# (в отличие от deploy_for_backend/go — здесь Dockerfile не подменяется).
# Тело сборки — в общем action docker-image.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for docker container

on:
  workflow_call:
    inputs:
      github_user:
        description: "The Github user who started workflow"  # владелец образа / логин в реестр
        type: string
        required: false
        default: $GITHUB_ACTOR
      format_mode:
        description: "Tag format: 'date' (legacy — version as is + latest) or 'semver' (vX.Y.Z, vX.Y, vX, latest)"
        type: string
        required: false
        default: 'date'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Build and publish image'
        uses: moogur/all-workflows/.github/actions/docker-image@master
        with:
          github_user: ${{ inputs.github_user }}
          format_mode: ${{ inputs.format_mode }}
          token: ${{ secrets.GITHUB_TOKEN }}
