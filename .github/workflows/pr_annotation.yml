# Запускает тесты Jest и публикует отчёт о покрытии в Pull Request
# с аннотациями упавших тестов. Переиспользуемый workflow (workflow_call).
name: Pull request annotation (jest)

on:
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip pipeline tests"  # 'true' — пропустить шаг покрытия
        type: string
        required: false
        default: 'false'
      folder:
        description: "Working folder"  # подпапка монорепозитория; '.' — корень
        type: string
        required: false
        default: '.'
      test_setup_script:
        description: "Подготовка к тестам: путь к скрипту относительно корня репозитория"  # выполняется перед шагом тестов
        type: string
        required: false
        default: ''
      test_setup_cache:
        description: "Подготовка к тестам: путь (или пути по одному на строку), кэшируемый между запусками"  # только вместе с test_setup_script
        type: string
        required: false
        default: ''

# Новый запуск для той же ветки/папки отменяет предыдущий незавершённый.
# pull-requests/checks: write — сторонний action оставляет отчёт и аннотации в PR.
permissions:
  contents: read
  packages: read
  pull-requests: write
  checks: write

concurrency:
  group: pr_annotation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.folder }}
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest
    # На PR из форка здесь выполнялся бы чужой код (lifecycle-скрипты npm и сами
    # тесты) в контексте базового репозитория. Секретов такому запуску GitHub не
    # выдаёт, а прав на аннотации — тем более, так что гонять его незачем.
    if: "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Для монорепозитория: переносим содержимое подпапки в корень.
      - name: 'Prepare working folder'
        if: "inputs.folder != '.'"
        env:
          FOLDER: ${{ inputs.folder }}
        run: cp -r "$FOLDER"/. .

      # Версия Node из package.json + setup-node.
      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        uses: moogur/all-workflows/.github/actions/npm-install@master

      # Токен нужен только на время установки. Дальше выполняется код проекта,
      # поэтому .npmrc с _authToken рядом с ним не остаётся.
      - name: 'Drop npm auth'
        run: rm -f .npmrc

      # Обёртка тестового скрипта: оставляет отчёт только первого запуска (головы PR), чтобы сводка
      # не показала базовую ветку, которой action гоняет тесты вторым заходом.
      - name: 'Jest wrapper'
        id: wrapper
        if: "inputs.skip_tests != 'true'"
        uses: moogur/all-workflows/.github/actions/jest-head-wrapper@master

      # Подготовка к тестам скриптом потребителя; путь считается от рабочей папки (folder уже в корне).
      # В test_setup_cache не кладите секреты: кэш Actions читает любой, у кого есть read-доступ к репозиторию.
      - name: 'Restore setup cache'
        if: "inputs.skip_tests != 'true' && inputs.test_setup_script != '' && inputs.test_setup_cache != ''"
        uses: actions/cache@v5
        with:
          path: ${{ inputs.test_setup_cache }}
          key: setup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.test_setup_script) }}

      - name: 'Run setup script'
        if: "inputs.skip_tests != 'true' && inputs.test_setup_script != ''"
        uses: moogur/all-workflows/.github/actions/run-build-script@master
        with:
          file_path: ${{ inputs.test_setup_script }}

      # Сторонний action: гоняет test-script и оставляет аннотации в PR.
      # skip-step: install — зависимости уже стоят, а свой install action
      # сделал бы без .npmrc и без доступа к приватному scope.
      # test-script идёт через обёртку: action добавляет к команде свои флаги jest, а обёртка передаёт
      # их проекту и сохраняет отчёт головы PR в jest-head.json (см. wrap.sh).
      - name: 'Test coverage (jest)'
        id: tests
        if: "inputs.skip_tests != 'true'"
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          annotations: failed-tests
          test-script: bash ${{ steps.wrapper.outputs.script }} ${{ runner.temp }}/jest-head.json
          skip-step: install

      # Сводка нужна и при упавших тестах; шаг пропущен — тесты не запускались (skip_tests или упал прошлый шаг).
      - name: 'Test summary'
        if: "!cancelled() && steps.tests.outcome != 'skipped'"
        uses: moogur/all-workflows/.github/actions/test-summary@master
        with:
          format: jest
          report: ${{ runner.temp }}/jest-head.json
