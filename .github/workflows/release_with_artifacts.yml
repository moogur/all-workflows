# УСТАРЕЛО: тонкая обёртка над release.yml, оставленная ради совместимости —
# потребители ссылаются на путь этого файла. Новые вызовы идут в release.yml
# напрямую, с параметрами artifact / artifact_suffix.
name: Release with artifacts

on:
  workflow_call:
    inputs:
      projectname:
        description: "Project name"  # = имя скачиваемого артефакта
        type: string
        required: false
        default: 'main'
      suffixname:
        description: "Suffix for project name"  # суффикс к имени файла ассета
        type: string
        required: false
        default: ''
      notes_source:
        description: "Release notes source: 'drafter' (PRs) or 'commits' (commits between tags)"
        type: string
        required: false
        default: 'drafter'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      artifact: ${{ inputs.projectname }}
      artifact_suffix: ${{ inputs.suffixname }}
      notes_source: ${{ inputs.notes_source }}
