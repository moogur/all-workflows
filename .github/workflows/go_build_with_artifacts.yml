# Кросс-компиляция Go через `make build` и загрузка результата как артефакта
# GitHub Actions (хранится 1 день). По тегу бинарник ещё и прикладывается к
# GitHub-релизу тега (github-release) — имя ассета включает goos/goarch, чтобы
# параллельные job'ы матрицы по разным платформам не затирали чужой ассет.
# Требует Makefile с целью build (GOOS/GOARCH/PROJECTNAME → ./bin/<projectname>).
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Build with artifacts

on:
  workflow_call:
    inputs:
      folder:
        description: "Working folder"  # подпапка монорепозитория; '.' — корень
        type: string
        required: false
        default: '.'
      goos:
        description: "OS"
        type: string # linux, darwin, windows, freebsd, netbsd, openbsd, dragonfly, plan9, nacl, android
        required: false
        default: 'linux'
      goarch:
        description: "Architecture"
        type: string  # 386, amd64, amd64p32, arm
        required: false
        default: 'amd64'
      projectname:
        description: "Project name"
        type: string
        required: false
        default: 'main'

# pull-requests: read — release-notes ищет смёрженный PR коммита через gh api.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.folder }}-${{ inputs.goos }}-${{ inputs.goarch }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Prepare working folder'
        if: "inputs.folder != '.'"
        run: cp -r ${{ inputs.folder }}/. .

      - name: 'Detect Go version'
        id: go
        uses: moogur/all-workflows/.github/actions/detect-go-version@master

      - name: 'Setup go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Build
        run: |
          make build GOOS=${{ inputs.goos }} GOARCH=${{ inputs.goarch }} PROJECTNAME=${{ inputs.projectname }}
          tar -czf ./${{ inputs.projectname }}.tar.gz ./bin/${{ inputs.projectname }}

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.projectname }}
          path: ./${{ inputs.projectname }}.tar.gz
          retention-days: 1

      # Копия под именем с goos/goarch: у релиза общий тег на всю матрицу, и
      # без платформы в имени параллельные job'ы перезаписали бы ассет друг друга.
      - name: 'Prepare release asset'
        if: github.ref_type == 'tag'
        run: cp ./${{ inputs.projectname }}.tar.gz ./${{ inputs.projectname }}-${{ inputs.goos }}-${{ inputs.goarch }}.tar.gz

      - name: 'Publish release'
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/github-release@master
        with:
          tag: ${{ github.ref_name }}
          assets: ./${{ inputs.projectname }}-${{ inputs.goos }}-${{ inputs.goarch }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
