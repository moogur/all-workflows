# Заготовка под аннотации тестов Go в Pull Request.
# Сейчас только готовит окружение Go; шаг запуска тестов закомментирован.
# Переиспользуемый workflow (workflow_call).
name: Pull request annotation (test)

on:
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip pipeline tests"
        type: string
        required: false
        default: 'false'
      folder:
        description: "Working folder"  # подпапка монорепозитория; '.' — корень
        type: string
        required: false
        default: '.'

# Новый запуск для той же ветки/папки отменяет предыдущий незавершённый.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.folder }}
  cancel-in-progress: true

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Prepare working folder'
        if: "inputs.folder != '.'"
        run: cp -r ${{ inputs.folder }}/. .

      - name: 'Detect Go version'
        id: go
        uses: moogur/all-workflows/.github/actions/detect-go-version@master

      - name: 'Setup go'
        if: "inputs.skip_tests != 'true'"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}

      # TODO: включить аннотации/прогон тестов Go (шаг намеренно отключён).
      # - name: Run tests
      #   if: "inputs.skip_tests != 'true'"
      #   run: go test -race -vet=off ./...
