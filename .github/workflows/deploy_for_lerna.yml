# Публикация пакетов монорепозитория через Lerna в GitHub Packages
# (`lerna publish from-package`). Переиспользуемый workflow (workflow_call).
# Секрет: GITHUB_TOKEN.
name: Lerna publish packages

on:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: "Setup git"
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"

      # Убираем скрипт prepare (husky), чтобы он не выполнялся при установке в CI.
      # jq пишет во временный файл: `echo $var > package.json` раскрывал глобы
      # в значениях (например, "files": ["*"]) и схлопывал JSON в одну строку.
      - name: "Remove husky from package.json"
        run: |
          jq 'del(.scripts.prepare)' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      - name: "Prepared packages"
        run: |
          npm run build

      - name: "Publish packages"
        run: |
          git add .
          git commit -m "temporary"

          npx lerna publish --registry=https://npm.pkg.github.com from-package --yes
