# Публикация пакетов монорепозитория через Lerna в GitHub Packages
# (`lerna publish from-package`). По тегу — GitHub-релиз с командами npm install
# на каждый непубличный ("private": true исключается) пакет из packages/*/package.json
# (стандартная раскладка Lerna; кастомный `packages` в lerna.json не читается).
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Lerna publish packages

on:
  workflow_call:

# pull-requests: read — release-notes ищет смёрженный PR коммита через gh api.
permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Setup node'
        uses: moogur/all-workflows/.github/actions/setup-node@master

      - name: "Setup git"
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"

      # Убираем скрипт prepare (husky), чтобы он не выполнялся при установке в CI.
      # jq пишет во временный файл: `echo $var > package.json` раскрывал глобы
      # в значениях (например, "files": ["*"]) и схлопывал JSON в одну строку.
      - name: "Remove husky from package.json"
        run: |
          jq 'del(.scripts.prepare)' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: 'Configure npm auth'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install'
        run: npm ci

      - name: "Prepared packages"
        run: |
          npm run build

      # До Publish packages: раскладка packages/*/package.json неверна — падаем
      # до публикации, а не после (nullglob — иначе jq получит буквальный glob).
      - name: 'Determine published packages'
        id: packages
        if: github.ref_type == 'tag'
        run: |
          shopt -s nullglob
          files=(packages/*/package.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no packages found in packages/*/package.json" >&2
            exit 1
          fi
          {
            echo "packages<<PACKAGES_EOF"
            jq -r 'select(.private != true) | "\(.name)@\(.version)"' "${files[@]}"
            echo "PACKAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Publish packages"
        run: |
          git add .
          git commit -m "temporary"

          npx lerna publish --registry=https://npm.pkg.github.com from-package --yes

      - name: 'Release notes'
        id: notes
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/npm-package-notes@master
        with:
          packages: ${{ steps.packages.outputs.packages }}

      - name: 'Publish release'
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/github-release@master
        with:
          tag: ${{ github.ref_name }}
          extra_notes: ${{ steps.notes.outputs.notes }}
          token: ${{ secrets.GITHUB_TOKEN }}
