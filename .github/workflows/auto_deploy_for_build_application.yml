# Автодеплой: проверяет новизну во внешнем репозитории и при изменении запускает
# deploy_for_build_application. «Последняя увиденная» версия — в переменной
# LAST_UPDATE_VALUE нужного GitHub Environment; записывается только после
# успешного деплоя. Переиспользуемый workflow.
# Секреты: UPDATE_VARIABLES_CLI_TOKEN (PAT для записи переменной), GITHUB_TOKEN.
name: Auto deploy for build application

on:
  workflow_call:
    inputs:
      repository_url:
        description: "Url for git repository"  # отслеживаемый внешний репозиторий
        type: string
        required: true
      environment:
        description: "Environment"  # GitHub Environment, где лежит LAST_UPDATE_VALUE
        type: string
        required: true
      type:
        description: "The type of definition of the latest version"
        type: string
        required: false
        default: "commit" # commit | tag
      repository_branch: # need for commit type
        description: "Branch to check for updates"
        type: string
        required: false
        default: "master"
      file_path:
        description: "The path to the execution file"
        type: string
        required: true
      notes_source:
        description: "Release notes source: 'none' (empty body), 'drafter' (PRs) or 'commits' (commits between tags)"
        type: string
        required: false
        default: 'none'

# Не уже прав вложенного deploy_for_build_application (ему нужен и Release Drafter).
permissions:
  contents: write
  pull-requests: read

jobs:
  checking_to_use_the_latest_version:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}  # нужен для чтения vars.LAST_UPDATE_VALUE
    outputs:
      last_update_value: ${{ steps.check.outputs.value }}

    steps:
      # Свой репозиторий здесь не нужен: сравнение идёт по внешнему.
      - name: 'Check'
        id: check
        uses: moogur/all-workflows/.github/actions/remote-update-check@master
        with:
          repository_url: ${{ inputs.repository_url }}
          type: ${{ inputs.type }}
          repository_branch: ${{ inputs.repository_branch }}

      # Нет обновлений → намеренный `exit 1` (см. docs/modernization.md).
      - name: 'Cancel job'
        if: steps.check.outputs.value == vars.LAST_UPDATE_VALUE
        run: exit 1

  # Запускается только если версия изменилась (предыдущий job прошёл).
  # В этом сценарии путь к скрипту сборки совпадает со значением repository_branch.
  auto_deploy:
    needs: checking_to_use_the_latest_version
    uses: ./.github/workflows/deploy_for_build_application.yml
    secrets: inherit
    with:
      file_path: ${{ inputs.repository_branch }}
      notes_source: ${{ inputs.notes_source }}

  # Версию запоминаем только после успешного деплоя.
  save_update_value:
    needs: [checking_to_use_the_latest_version, auto_deploy]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}  # на случай, если PAT — секрет окружения

    steps:
      - name: 'Save update value'
        uses: moogur/all-workflows/.github/actions/save-update-value@master
        with:
          environment: ${{ inputs.environment }}
          name: LAST_UPDATE_VALUE
          value: ${{ needs.checking_to_use_the_latest_version.outputs.last_update_value }}
          token: ${{ secrets.UPDATE_VARIABLES_CLI_TOKEN }}
