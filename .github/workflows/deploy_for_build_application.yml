# Выполняет произвольный скрипт сборки и, если запуск идёт по тегу, создаёт
# GitHub-релиз с application.zip (скрипт должен сам создать этот файл в корне).
# Без тега (авто-деплой по расписанию) сборка выполняется, релиз пропускается.
# Тело релиза собирает github-release: смёрженный PR — по PR, прямой коммит — по коммиту.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for build application

on:
  workflow_call:
    inputs:
      file_path:
        description: "The path to the execution file"  # скрипт сборки, запускается через `. <file_path>`
        type: string
        required: true

# pull-requests: read — release-notes ищет смёрженный PR коммита через gh api.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-application-job:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Падаем на неверном теге до сборки, а не после неё.
      - name: 'Check tag format'
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/tag-format@master
        with:
          version: ${{ github.ref_name }}

      # prefix: '' — тег используется как есть, без снятия префикса.
      - name: "Determining the version"
        id: version
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/app-version@master
        with:
          mode: ref
          prefix: ''

      # Запуск пользовательского скрипта сборки в текущей оболочке (source).
      - name: Build project
        run: |
          . ${{ inputs.file_path }}

      - name: 'Publish release'
        if: github.ref_type == 'tag'
        uses: moogur/all-workflows/.github/actions/github-release@master
        with:
          tag: ${{ steps.version.outputs.version }}
          title: Release ${{ steps.version.outputs.version }}
          assets: ./application.zip
          token: ${{ secrets.GITHUB_TOKEN }}
