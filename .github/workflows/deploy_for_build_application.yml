# Выполняет произвольный скрипт сборки, создаёт GitHub-релиз и прикладывает
# application.zip (скрипт должен сам создать этот файл в корне).
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for build application

on:
  workflow_call:
    inputs:
      file_path:
        description: "The path to the execution file"  # скрипт сборки, запускается через `. <file_path>`
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-application-job:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # prefix: '' — тег используется как есть, без снятия префикса.
      - name: "Determining the version"
        id: version
        uses: moogur/all-workflows/.github/actions/app-version@master
        with:
          prefix: ''

      # Запуск пользовательского скрипта сборки в текущей оболочке (source).
      - name: Build project
        run: |
          . ${{ inputs.file_path }}

      # ПРИМЕЧАНИЕ: create-release/upload-release-asset заархивированы; см. docs/modernization.md.
      - name: Create Release
        id: create_release
        uses: actions/create-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./application.zip
          asset_name: application.zip
          asset_content_type: application/zip
