# Сборка и публикация Docker-образа Node.js-бэкенда в GitHub Packages.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for backend

on:
  workflow_call:
    inputs:
      github_user:
        description: "The Github user who started workflow"  # владелец образа / логин в реестр
        type: string
        required: false
        default: $GITHUB_ACTOR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # полная история — для версии по git-тегу

      # Версия Node для build-arg сборки образа.
      - name: 'Detect Node.js version'
        id: node
        uses: moogur/all-workflows/.github/actions/detect-node-version@master

      # Имя образа в GitHub Packages: <user>/<repo>/<repo>.
      # ПРИМЕЧАНИЕ: docker.pkg.github.com устарел; см. docs/modernization.md.
      - name: 'Global env'
        id: global_env
        run: |
          echo "IMAGE_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          echo "DOCKERHUB_IMAGE_NAME=docker.pkg.github.com/${{ inputs.github_user }}/${{ github.event.repository.name }}/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      # Версия приложения из последнего git-тега (v1.2.3 → 1.2.3).
      - name: 'Version'
        id: version
        uses: moogur/all-workflows/.github/actions/app-version@master

      # .npmrc для доступа к приватным пакетам @moogur при сборке образа.
      - name: "Setup npm"
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile и .dockerignore тянутся из этого же репозитория (ветка master).
      - name: 'Add docker file'
        run: |
          wget -O ./.dockerignore https://raw.githubusercontent.com/moogur/all-workflows/master/dockerfiles/.dockerignore
          wget -O ./Dockerfile https://raw.githubusercontent.com/moogur/all-workflows/master/dockerfiles/deploy_backend.dockerfile

      # Два тега: конкретная версия и latest.
      - name: 'Build and tag image'
        run: |
          docker build --build-arg ARG_NODE_VERSION="${{ steps.node.outputs.version }}" --build-arg ARG_APP_VERSION="${{ steps.version.outputs.version }}" -t "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:latest" -t "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.version }}" .

      - name: 'docker login'
        run: docker login docker.pkg.github.com -u ${{ inputs.github_user }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: 'Publish image'
        run: |
          docker push "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "${{ steps.global_env.outputs.DOCKERHUB_IMAGE_NAME }}:latest"
