# Сборка и публикация Docker-образа Node.js-бэкенда в GitHub Packages.
# Тело сборки — в общем action docker-image; здесь только специфика Node:
# версия для build-arg, .npmrc для приватных пакетов и свой Dockerfile.
# Переиспользуемый workflow (workflow_call). Секрет: GITHUB_TOKEN.
name: Deploy for backend

on:
  workflow_call:
    inputs:
      github_user:
        description: "The Github user who started workflow"  # владелец образа / логин в реестр
        type: string
        required: false
        default: $GITHUB_ACTOR
      format_mode:
        description: "Tag format: 'date' (legacy — version as is + latest) or 'semver' (vX.Y.Z, vX.Y, vX, latest)"
        type: string
        required: false
        default: 'date'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-job:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Версия Node для build-arg сборки образа.
      - name: 'Detect Node.js version'
        id: node
        uses: moogur/all-workflows/.github/actions/detect-node-version@master

      # .npmrc для доступа к приватным пакетам @moogur при сборке образа.
      - name: 'Setup npm'
        uses: moogur/all-workflows/.github/actions/npm-auth@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and publish image'
        uses: moogur/all-workflows/.github/actions/docker-image@master
        with:
          github_user: ${{ inputs.github_user }}
          format_mode: ${{ inputs.format_mode }}
          dockerfile: deploy_backend.dockerfile
          dockerignore: .dockerignore
          build_args: ARG_NODE_VERSION=${{ steps.node.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
