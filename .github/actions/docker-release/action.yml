name: 'Publish GitHub release for a docker tag build'
description: 'Публикует GitHub-релиз для тега docker-сборки через общую цепочку github-release: тело — из PR/коммитов, плюс блок со ссылкой на опубликованный docker-образ.'

inputs:
  version:
    description: 'Тег, инициировавший сборку'
    required: true
  tags:
    description: 'Полные ссылки на образ со всеми тегами (<image>:<tag>, через пробел) — вывод docker-tags'
    required: true
  token:
    description: 'Токен с правом contents: write, обычно GITHUB_TOKEN'
    required: true

runs:
  using: 'composite'
  steps:
    - id: image_notes
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
        VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/image-notes.sh"

    - uses: moogur/all-workflows/.github/actions/github-release@master
      with:
        tag: ${{ inputs.version }}
        extra_notes: ${{ steps.image_notes.outputs.notes }}
        token: ${{ inputs.token }}
