name: 'Build release notes from commits'
description: 'Собирает тело GitHub-релиза: коммит, смёрженный через PR, — одной записью по PR (заголовок, автор, категория по меткам); коммит без PR — по формату commit-msg.'

inputs:
  tag:
    description: 'Тег релиза. Пустая строка — тег, инициировавший запуск (GITHUB_REF).'
    required: false
    default: ''
  previous_tag:
    description: 'Тег, с которым сравнивать. Пустая строка — соседний по дате создания.'
    required: false
    default: ''
  notes_file:
    description: 'Куда записать тело релиза. Пустая строка — $RUNNER_TEMP/release-notes.md.'
    required: false
    default: ''
  token:
    description: 'Токен для поиска смёрженного PR коммита (gh api .../commits/<sha>/pulls). Пустая строка — тело собирается только из коммитов.'
    required: false
    default: ''

outputs:
  notes_file:
    description: 'Путь к файлу с телом релиза'
    value: ${{ steps.notes.outputs.notes_file }}
  previous_tag:
    description: 'Тег, с которым сравнивали (пусто, если релиз первый)'
    value: ${{ steps.notes.outputs.previous_tag }}
  commit_count:
    description: 'Число коммитов в диапазоне (без слияний)'
    value: ${{ steps.notes.outputs.commit_count }}

runs:
  using: 'composite'
  steps:
    - id: notes
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        NOTES_FILE: ${{ inputs.notes_file }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/notes.sh"
