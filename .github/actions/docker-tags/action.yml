name: 'Resolve docker image tags'
description: 'Формирует полный список тегов docker-образа по версии. Формат определяется по версии: дата — версия + latest, semver — vX.Y.Z, vX.Y, vX, latest.'

inputs:
  image:
    description: 'Полное имя образа без тега (например, docker.pkg.github.com/user/repo/repo).'
    required: true
  version:
    description: 'Версия сборки: git-тег (dd.mm.yyyy или vX.Y.Z) либо метка авто-сборки dd.mm.yyyy-HHMM-auto.'
    required: true

outputs:
  tags:
    description: 'Полные ссылки на образ (<image>:<tag>), разделённые пробелом'
    value: ${{ steps.resolve.outputs.tags }}

runs:
  using: 'composite'
  steps:
    - id: format
      uses: moogur/all-workflows/.github/actions/tag-format@master
      with:
        version: ${{ inputs.version }}

    - id: resolve
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        FORMAT: ${{ steps.format.outputs.format }}
      run: bash "$GITHUB_ACTION_PATH/tags.sh"
